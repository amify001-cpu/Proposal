<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>affectionree</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --gold:#c9a84c;
  --gold-l:#e8c97a;
  --gold-p:#f5e9c8;
  --g0:#080f0a;
  --g1:#0d1f12;
  --g2:#12291a;
  --g3:#1a3d24;
  --g4:#235030;
  --cream:#fdf8ee;
  --cream2:#f7f0dc;
  --ink:#1a0f00;
  --ink2:#3a2800;
  --ink3:#6b4e00;
}

html,body{height:100%;overflow:hidden}

body{
  background:var(--g0);
  font-family:'Cormorant Garamond',Georgia,serif;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}

/* ── Canvas particles ── */
#canvas{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── Stage wrapper ── */
#app{
  position:relative;z-index:10;
  width:min(680px,100vw);
  height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 20px;
}

/* ── Progress bar (crescent moons) ── */
#progress{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;
  z-index:20;
  background:rgba(8,15,10,0.7);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:40px;
  padding:8px 18px;
  backdrop-filter:blur(6px);
}
.prog-dot{
  width:9px;height:9px;border-radius:50%;
  background:rgba(201,168,76,0.2);
  border:1px solid rgba(201,168,76,0.4);
  transition:all 0.5s ease;
}
.prog-dot.done{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.prog-dot.active{background:var(--gold-l);box-shadow:0 0 14px var(--gold-l);transform:scale(1.4);}
#prog-label{font-size:11px;color:var(--gold);letter-spacing:2px;font-family:'Cinzel',serif;margin-left:6px;}

/* ── Brand watermark ── */
#brand{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:4px;
  color:rgba(201,168,76,0.3);z-index:20;
  text-transform:lowercase;
}

/* ── Card ── */
.card{
  background:var(--cream);
  border-radius:6px;
  width:100%;
  max-height:calc(100vh - 120px);
  overflow-y:auto;
  box-shadow:0 0 80px rgba(201,168,76,0.15),0 0 0 1px rgba(201,168,76,0.2);
  position:relative;
  opacity:0;
  transform:translateY(28px) scale(0.98);
  transition:opacity 0.7s ease,transform 0.7s ease;
}
.card.visible{opacity:1;transform:translateY(0) scale(1);}
.card.out{opacity:0;transform:translateY(-28px) scale(0.98);}

/* scrollbar */
.card::-webkit-scrollbar{width:4px}
.card::-webkit-scrollbar-track{background:transparent}
.card::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);border-radius:2px}

/* ── Card top strip ── */
.card-header{
  background:var(--g2);
  padding:0 0 0;
  position:relative;
  overflow:hidden;
}
.strip{height:5px;background:repeating-linear-gradient(90deg,var(--gold) 0,var(--gold) 7px,var(--g3) 7px,var(--g3) 14px,var(--gold-l) 14px,var(--gold-l) 17px,var(--g2) 17px,var(--g2) 24px);}
.card-header-inner{padding:22px 36px 20px;text-align:center;}
.stage-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:4px;color:var(--gold);margin-bottom:10px;opacity:0.8;}
.stage-title{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,4vw,27px);font-weight:600;color:var(--gold-p);line-height:1.3;}
.stage-subtitle{font-size:13px;color:rgba(245,233,200,0.5);margin-top:6px;font-style:italic;letter-spacing:0.5px;}

/* ── Card body ── */
.card-body{padding:28px 36px 32px;}

/* ── Message block ── */
.msg{
  font-size:clamp(15px,2.5vw,17px);
  line-height:1.95;
  color:var(--ink2);
  margin-bottom:22px;
  font-weight:300;
}
.msg em{color:var(--ink);font-style:italic;font-weight:400;}
.msg strong{color:var(--g3);font-weight:600;}

/* ── Arabic quote ── */
.arabic-box{
  background:var(--g1);
  border:1px solid rgba(201,168,76,0.25);
  border-radius:3px;
  padding:16px 20px;
  margin:20px 0;
  text-align:center;
}
.arabic-box .ar{font-family:'Amiri',serif;font-size:clamp(18px,3vw,22px);color:var(--gold-l);direction:rtl;line-height:1.8;margin-bottom:8px;}
.arabic-box .tr{font-style:italic;font-size:13px;color:rgba(245,233,200,0.55);line-height:1.6;}
.arabic-box .ref{font-size:11px;color:var(--gold);margin-top:5px;letter-spacing:1px;}

/* ── Question block ── */
.question{
  background:linear-gradient(135deg,rgba(26,61,36,0.12),rgba(26,61,36,0.05));
  border-left:3px solid var(--gold);
  border-radius:0 4px 4px 0;
  padding:16px 20px;
  margin:22px 0 24px;
  font-size:clamp(16px,2.8vw,19px);
  font-style:italic;
  color:var(--ink);
  line-height:1.7;
}
.question small{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:6px;letter-spacing:1px;}

/* ── Choices ── */
.choices{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.choice{
  background:white;
  border:1.5px solid rgba(201,168,76,0.3);
  border-radius:4px;
  padding:14px 20px;
  cursor:pointer;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(14px,2.5vw,16px);
  color:var(--ink2);
  transition:all 0.25s ease;
  text-align:left;
  line-height:1.5;
  position:relative;
  overflow:hidden;
}
.choice::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(201,168,76,0.08),transparent);
  opacity:0;transition:opacity 0.25s;
}
.choice:hover{border-color:var(--gold);color:var(--ink);transform:translateX(4px);}
.choice:hover::before{opacity:1;}
.choice:active{transform:translateX(4px) scale(0.99);}
.choice .badge{
  font-size:10px;letter-spacing:1.5px;
  color:var(--gold);font-family:'Cinzel',serif;
  display:block;margin-bottom:3px;opacity:0.7;
}

/* ── Inline response (after choice selected) ── */
.response-box{
  background:var(--g1);
  border-radius:4px;
  padding:18px 22px;
  margin-top:10px;
  display:none;
  animation:slideIn 0.5s ease forwards;
}
.response-box p{font-size:15px;color:var(--gold-p);line-height:1.8;font-style:italic;}
.response-box .r-tag{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;display:block;opacity:0.7;}

@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Continue button ── */
.btn-continue{
  display:block;width:100%;
  background:var(--g2);
  border:1px solid var(--gold);
  border-radius:4px;
  padding:14px;
  margin-top:22px;
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:3px;
  color:var(--gold);
  cursor:pointer;
  transition:all 0.3s;
  text-align:center;
  opacity:0;
  pointer-events:none;
}
.btn-continue.ready{opacity:1;pointer-events:all;}
.btn-continue:hover{background:var(--g3);box-shadow:0 0 20px rgba(201,168,76,0.15);}

/* ── Special: opening screen ── */
.opening{text-align:center;padding:44px 36px;}
.brand-name{
  font-family:'Cinzel',serif;
  font-size:clamp(28px,6vw,46px);
  font-weight:400;
  letter-spacing:8px;
  color:var(--g1);
  margin-bottom:8px;
  text-transform:lowercase;
}
.brand-sub{font-style:italic;font-size:15px;color:var(--ink3);margin-bottom:30px;letter-spacing:1px;}
.opening-bismillah{font-family:'Amiri',serif;font-size:26px;color:var(--g2);direction:rtl;margin-bottom:6px;}
.opening-tr{font-size:12px;color:var(--ink3);letter-spacing:1px;margin-bottom:30px;font-style:italic;}

.moon-icon{margin:0 auto 20px;display:block;}

.btn-begin{
  display:inline-block;
  background:var(--g2);
  border:1px solid var(--gold);
  border-radius:4px;
  padding:14px 40px;
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:4px;
  color:var(--gold);
  cursor:pointer;
  transition:all 0.3s;
  margin-top:10px;
}
.btn-begin:hover{background:var(--g3);box-shadow:0 0 30px rgba(201,168,76,0.2);}

.divider{
  display:flex;align-items:center;gap:10px;
  margin:16px 0;
}
.divider .l{height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(26,61,36,0.25));}
.divider .l.r{background:linear-gradient(90deg,rgba(26,61,36,0.25),transparent);}
.divider .d{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);opacity:0.6;}

/* ── Final proposal screen ── */
.final-header{
  background:var(--g1);
  text-align:center;
  padding:32px 32px 26px;
  position:relative;
  overflow:hidden;
}
.final-header::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.08),transparent 70%);
  pointer-events:none;
}
.final-bismillah{font-family:'Amiri',serif;font-size:28px;color:var(--gold-l);direction:rtl;display:block;margin-bottom:6px;}
.final-tr{font-size:12px;font-style:italic;color:rgba(245,233,200,0.4);letter-spacing:1.5px;}
.final-title{font-family:'Cinzel',serif;font-size:clamp(14px,3vw,18px);letter-spacing:5px;color:var(--gold);margin-top:16px;}

.proposal-text{
  font-size:clamp(16px,2.5vw,18px);line-height:2;
  color:var(--ink2);font-weight:300;
  margin-bottom:20px;
}
.proposal-text em{color:var(--ink);font-weight:400;}
.proposal-text strong{color:var(--g3);font-weight:600;}

.the-question{
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(20px,4vw,26px);
  font-style:italic;
  font-weight:600;
  color:var(--ink);
  padding:28px 20px;
  line-height:1.5;
  border-top:1px solid rgba(201,168,76,0.25);
  border-bottom:1px solid rgba(201,168,76,0.25);
  margin:24px 0;
  position:relative;
}
.the-question::before,.the-question::after{
  content:'✦';
  color:var(--gold);font-size:14px;
  position:absolute;top:50%;transform:translateY(-50%);
}
.the-question::before{left:12px;}
.the-question::after{right:12px;}

.final-choices{display:flex;gap:12px;margin-top:6px;}
.final-choice{
  flex:1;
  background:white;border:1.5px solid rgba(201,168,76,0.3);
  border-radius:4px;padding:16px 10px;
  cursor:pointer;font-family:'Cormorant Garamond',serif;
  font-size:15px;color:var(--ink2);text-align:center;
  transition:all 0.25s;line-height:1.5;
}
.final-choice:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 20px rgba(201,168,76,0.1);}
.final-choice .emoji{font-size:22px;display:block;margin-bottom:6px;}

/* ── Ending screen ── */
.ending{text-align:center;padding:44px 32px;}
.ending-arabic{font-family:'Amiri',serif;font-size:30px;color:var(--g2);direction:rtl;margin-bottom:6px;}
.ending-tr{font-style:italic;font-size:13px;color:var(--ink3);margin-bottom:28px;}
.ending-msg{font-size:16px;line-height:1.9;color:var(--ink2);font-weight:300;margin-bottom:24px;}
.dua-final{
  background:var(--g1);
  border-radius:4px;padding:20px 24px;
  margin-top:20px;
}
.dua-final p{font-size:15px;color:var(--gold-p);font-style:italic;line-height:1.8;}
.dua-final span{display:block;font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:8px;font-family:'Cinzel',serif;font-style:normal;}

/* ── Responsive ── */
@media(max-width:500px){
  .card-body,.card-header-inner,.opening,.ending{padding-left:22px;padding-right:22px;}
  .final-choices{flex-direction:column;}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="progress" style="display:none">
  <div class="prog-dot active" id="d0"></div>
  <div class="prog-dot" id="d1"></div>
  <div class="prog-dot" id="d2"></div>
  <div class="prog-dot" id="d3"></div>
  <div class="prog-dot" id="d4"></div>
  <div class="prog-dot" id="d5"></div>
  <div class="prog-dot" id="d6"></div>
  <span id="prog-label">I / VII</span>
</div>

<div id="app">
  <div class="card" id="card"></div>
</div>

<div id="brand">affectionree</div>

<script>
/* ════════════════════════════════
   PARTICLE CANVAS
════════════════════════════════ */
const cvs=document.getElementById('canvas');
const ctx=cvs.getContext('2d');
let W,H,particles=[];
function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}
resize();window.addEventListener('resize',resize);

class Particle{
  constructor(){this.reset(true)}
  reset(init){
    this.x=Math.random()*W;
    this.y=init?Math.random()*H:H+10;
    this.size=Math.random()*1.8+0.3;
    this.speed=Math.random()*0.4+0.1;
    this.opacity=0;this.maxOp=Math.random()*0.6+0.1;
    this.life=0;this.maxLife=200+Math.random()*400;
  }
  update(){
    this.y-=this.speed;this.life++;
    if(this.life<40)this.opacity=this.maxOp*(this.life/40);
    else if(this.life>this.maxLife-40)this.opacity=this.maxOp*((this.maxLife-this.life)/40);
    else this.opacity=this.maxOp;
    if(this.life>=this.maxLife)this.reset(false);
  }
  draw(){
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=`rgba(201,168,76,${this.opacity})`;ctx.fill();
  }
}
for(let i=0;i<120;i++)particles.push(new Particle());
(function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw();})})();

/* ════════════════════════════════
   STAGES DATA
════════════════════════════════ */
const STAGES=[
  {type:'opening'},

  {
    type:'question',
    label:'STAGE I',
    title:'A Quiet Observation',
    subtitle:'Answer honestly just for yourself',
    msg:`Before anything else, I want to ask you something simple. Not to trick you but to make you feel seen.`,
    arabic:{ar:'وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ',tr:'"And We have certainly honoured the children of Adam."  Surah Al-Isra 17:70',},
    question:'Have you ever had the feeling that someone, quietly and from a distance, has been making du\'a for you wishing you peace without saying a word?',
    qnote:'Take a moment. Trust your instinct.',
    choices:[
      {text:'Yes… I have felt something like that.',badge:'FELT IT',resp:'That feeling was real. It was me. Every time I saw you, I asked Allah to keep you safe before I ever found the words to say anything.'},
      {text:'Perhaps, but I never thought about it.',badge:'MAYBE',resp:'Perhaps you didn\'t notice and that is alright. Some du\'as are whispered so softly that only Allah hears them. He heard mine, for you.'},
      {text:'No, I don\'t think so.',badge:'HONESTLY',resp:'That is honest, and I respect it. But now you know there was someone. There is someone. And his du\'a for you never stopped.'},
    ]
  },

  {
    type:'question',
    label:'STAGE II',
    title:'What I Notice',
    subtitle:'Things I have never said aloud',
    msg:`I want you to know what it is I actually see when I look at you. Not what the world sees what I do.`,
    question:'When you think about yourself which of these do you feel you carry most quietly, rarely getting credit for?',
    qnote:'There is no wrong answer here.',
    choices:[
      {text:'My patience: I bear a lot in silence.',badge:'INNER STRENGTH',resp:'I see it. I see how you carry weight with grace, how you never make it a performance. That quiet strength is one of the things that made me certain about my feelings.'},
      {text:'My sincerity: I mean everything I say.',badge:'TRUE HEART',resp:'I know. It shows. The way you speak, the way you act there is no performance in you. That sincerity is precious, and it is not lost on me.'},
      {text:'My faith: I try to be close to Allah.',badge:'DEVOTION',resp:'It is perhaps the most beautiful thing about you. I do not just admire your deen it is the reason I believe we could build something that matters, something that lasts beyond this world.'},
    ]
  },

  {
    type:'question',
    label:'STAGE III',
    title:'What Love Means to Me',
    subtitle:'Let me show you how I think',
    msg:`In our deen, love is not a fleeting spark it is a commitment, a responsibility, a mercy. I want you to know how I understand it.`,
    arabic:{ar:'وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً',tr:'"And He placed between you affection and mercy." Surah Ar-Rum 30:21'},
    question:'If you could choose one thing that should define a marriage, what would it be?',
    qnote:'What does your heart say?',
    choices:[
      {text:'Mutual respect: being seen as an equal.',badge:'DIGNITY',resp:'That is exactly what I would give you. I do not want a companion to possess I want a partner to walk beside. Your voice would matter. Your thoughts would matter. Always.'},
      {text:'Deep loyalty: being someone\'s constant.',badge:'FAITHFULNESS',resp:'To be someone\'s constant Yes. That is what I want to be. Not someone who appears when it is easy. Someone who stays when it is difficult, who shows up for every season of your life.'},
      {text:'Shared purpose building something meaningful.',badge:'PURPOSE',resp:'A home built on Taqwa  that is the dream I carry. Not just a house, not just a relationship. A shared journey toward something greater than both of us.'},
    ]
  },

  {
    type:'message',
    label:'STAGE IV',
    title:'A Letter from My Heart',
    subtitle:'No questions. Just honesty.',
    msg:`There is something I need you to sit with for a moment.`,
    content:`
      <p class="msg">I have watched you not in the way that makes you uncomfortable, but in the way a person watches something they consider beautiful and do not want to disturb.</p>
      <p class="msg">I noticed the way you carry your <em>deen</em> not loudly, not for display, but as something woven into who you are. I noticed the way you treat people with a gentleness that most do not even realise you are offering.</p>
      <p class="msg">I noticed you in the small moments. And those small moments told me something loud.</p>
      <div class="arabic-box">
        <div class="ar">رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ</div>
        <div class="tr">"Our Lord, grant us from among our spouses and offspring comfort to our eyes."</div>
        <div class="ref"> Surah Al-Furqan 25:74</div>
      </div>
      <p class="msg">When I recite this du'a, I think of you. I think of a future where you are the <em>qurrat ul-'ayn</em>,  the coolness of eyes that this ayah speaks of. I say this not to flatter you. I say it because it is the deepest truth I carry.</p>
      <p class="msg">I have never wanted to make you uncomfortable, or to approach this without honour. So I chose this path <strong>to let you feel it first</strong>, before any word was spoken.</p>
    `,
  },

  {
    type:'question',
    label:'STAGE V',
    title:'Something to Reflect On',
    subtitle:'Almost there — stay with me',
    msg:`I am nearly ready to say what I came here to say. But first  one last question.`,
    question:'If someone wanted to honour you truly honour you, what would that look like to you?',
    qnote:'This matters to me deeply.',
    choices:[
      {text:'Approaching my family with sincerity and respect.',badge:'PROPER PATH',resp:'That is exactly how I intend to do this. Through your Wali, through the right doors, with full transparency. You deserve nothing less than that.'},
      {text:'Being patient not rushing me.',badge:'GENTLENESS',resp:'I would wait. However long it takes. My feelings are not a demand they are an offering. You owe me nothing. I simply owe you honesty.'},
      {text:'Being honest about intentions from the start.',badge:'CLARITY',resp:'So here I am being honest. My intention is Nikah. My intention is a life built with you, in the way Allah intended. Nothing hidden. Nothing impure.'},
    ]
  },

  {type:'proposal'},
  {type:'ending'},
];

/* ════════════════════════════════
   STATE
════════════════════════════════ */
let current=0;
let choiceMade=false;
const card=document.getElementById('card');
const prog=document.getElementById('progress');

/* ════════════════════════════════
   RENDER
════════════════════════════════ */
function render(idx){
  const s=STAGES[idx];
  card.classList.remove('visible','out');

  setTimeout(()=>{
    card.innerHTML=buildHTML(s);
    card.scrollTop=0;
    updateProgress(idx);
    setTimeout(()=>card.classList.add('visible'),30);
    bindEvents(s,idx);
  },350);
}

function buildHTML(s){
  if(s.type==='opening') return buildOpening();
  if(s.type==='proposal') return buildProposal();
  if(s.type==='ending') return buildEnding();
  if(s.type==='message') return buildMessage(s);
  if(s.type==='question') return buildQuestion(s);
  return '';
}

/* ── Opening ── */
function buildOpening(){
  return`<div class="opening">
    <svg class="moon-icon" width="64" height="64" viewBox="0 0 64 64" fill="none">
      <path d="M40 12C28 14,20 24,22 36C24 48,36 56,48 52C34 56,18 46,18 32C18 18,30 8,44 12Z" fill="#c9a84c"/>
      <polygon points="52,16 53.4,20.2 57.8,20.2 54.2,22.8 55.6,27 52,24.4 48.4,27 49.8,22.8 46.2,20.2 50.6,20.2" fill="#e8c97a"/>
    </svg>
    <div class="opening-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
    <div class="opening-tr">In the name of Allah, the Most Gracious, the Most Merciful</div>
    <div class="divider"><span class="l"></span><span class="d"></span><span class="l r"></span></div>
    <div class="brand-name">affectionree</div>
    <div class="brand-sub">a journey of sincere feelings</div>
    <p class="msg" style="max-width:400px;margin:0 auto 28px;text-align:center;font-size:15px;color:var(--ink3)">
      Someone has asked you to take a small journey with them. A journey through questions, through honesty — and through a feeling they have carried quietly for a long time.
    </p>
    <p class="msg" style="max-width:380px;margin:0 auto 6px;text-align:center;font-size:14px;color:var(--ink3);font-style:italic">
      There are <strong style="color:var(--g3)">7 moments</strong> ahead. Each one is real. Each one is for you.
    </p>
    <button class="btn-begin" onclick="advance()">Begin the Journey →</button>
  </div>`;
}

/* ── Question ── */
function buildQuestion(s){
  const choices=s.choices.map((c,i)=>`
    <button class="choice" data-i="${i}" onclick="pickChoice(this,${i})">
      <span class="badge">${c.badge}</span>
      ${c.text}
    </button>
    <div class="response-box" id="resp${i}">
      <span class="r-tag">HE SAYS ✦</span>
      <p>${c.resp}</p>
    </div>
  `).join('');
  const arabicBlock=s.arabic?`<div class="arabic-box"><div class="ar">${s.arabic.ar}</div><div class="tr">${s.arabic.tr}</div></div>`:'';
  return`
    <div class="card-header">
      <div class="strip"></div>
      <div class="card-header-inner">
        <div class="stage-label">${s.label}</div>
        <div class="stage-title">${s.title}</div>
        <div class="stage-subtitle">${s.subtitle}</div>
      </div>
    </div>
    <div class="card-body">
      <p class="msg">${s.msg}</p>
      ${arabicBlock}
      <div class="question">${s.question}<small>${s.qnote}</small></div>
      <div class="choices">${choices}</div>
      <button class="btn-continue" id="cont" onclick="advance()">Continue the Journey →</button>
    </div>`;
}

/* ── Message ── */
function buildMessage(s){
  return`
    <div class="card-header">
      <div class="strip"></div>
      <div class="card-header-inner">
        <div class="stage-label">${s.label}</div>
        <div class="stage-title">${s.title}</div>
        <div class="stage-subtitle">${s.subtitle}</div>
      </div>
    </div>
    <div class="card-body">
      <p class="msg">${s.msg}</p>
      ${s.content}
      <button class="btn-continue ready" onclick="advance()">I have read this — continue →</button>
    </div>`;
}

/* ── Proposal ── */
function buildProposal(){
  return`
    <div class="final-header">
      <div class="strip"></div>
      <span class="final-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</span>
      <span class="final-tr">In the name of Allah</span>
      <div class="final-title">THE PROPOSAL</div>
    </div>
    <div class="card-body">
      <p class="proposal-text">You have walked through every question with me. You have seen how I think, how I feel, how I hold your deen and your character in the highest regard.</p>
      <p class="proposal-text">Now let me say what has been waiting to be said.</p>
      <p class="proposal-text">I am not standing here with poetry. I am standing here with <em>niyyah</em> — sincere intention. I want to do this <strong>the right way</strong>. Through your family. Through your Wali. Through every door that Islam has opened for this purpose.</p>
      <p class="proposal-text">I am not asking for your heart as though I deserve it I am asking for the chance to <em>earn</em> it. Every single day. For the rest of our lives. I want to be the person who protects your peace, who prays beside you, who holds your hand in Jannah, in sha Allah.</p>
      <div class="arabic-box" style="margin:20px 0">
        <div class="ar">رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ</div>
        <div class="tr">"My Lord, indeed I am in need of whatever good You would send down to me." — Surah Al-Qasas 28:24</div>
        <div class="tr" style="margin-top:8px;color:rgba(245,233,200,0.4)">This was the du\'a of Musa ﷺ — and it is the du\'a of my heart for you.</div>
      </div>
      <div class="the-question">Will you allow me to approach your family — with full sincerity — and ask for your hand in Nikah?</div>
      <div class="final-choices">
        <button class="final-choice" onclick="respond('yes')">
          <span class="emoji">🌙</span>
          Yes — I am open to this
        </button>
        <button class="final-choice" onclick="respond('think')">
          <span class="emoji">✨</span>
          I need time to reflect
        </button>
        <button class="final-choice" onclick="respond('no')">
          <span class="emoji">🤍</span>
          I appreciate it, but no
        </button>
      </div>
    </div>`;
}

/* ── Ending ── */
function buildEnding(){
  const r=window._resp||'yes';
  const msgs={
    yes:{
      title:'الحمد لله',
      tr:'All praise is to Allah',
      msg:`You have made my heart full of gratitude not to you alone, but to Allah first, who wrote this moment. I will speak to your family with every ounce of respect and sincerity I carry. I promise you this is only the beginning of something built on truth.`,
      dua:`May Allah bless this union, make it a source of mercy for both of us, and keep it strong through every storm. Ameen.`
    },
    think:{
      title:'جَزَاكِ اللَّهُ خَيْرًا',
      tr:'May Allah reward you with goodness',
      msg:`Your care in this decision is itself a sign of your character. Take all the time you need. I am not going anywhere. I will make du\'a, and I will wait because something worth having is worth waiting for.`,
      dua:`May Allah guide your heart to what is best for you whether that is with me or without me. I accept His decree with peace. Ameen.`
    },
    no:{
      title:'بَارَكَ اللَّهُ فِيكِ',
      tr:'May Allah bless you',
      msg:`I respect you deeply for your honesty. It takes courage. I hold no bitterness — only a sincere du\'a that Allah fills your life with someone who makes you feel seen, safe, and loved in every way you deserve.`,
      dua:`May Allah grant you the spouse who is the coolness of your eyes and the partner of your Jannah. You deserve every good thing. Ameen.`
    }
  };
  const m=msgs[r];
  return`<div class="ending">
    <svg style="margin:0 auto 16px;display:block" width="50" height="50" viewBox="0 0 64 64" fill="none">
      <path d="M40 12C28 14,20 24,22 36C24 48,36 56,48 52C34 56,18 46,18 32C18 18,30 8,44 12Z" fill="#c9a84c" opacity="0.7"/>
    </svg>
    <div class="ending-arabic">${m.title}</div>
    <div class="ending-tr">${m.tr}</div>
    <div class="divider"><span class="l"></span><span class="d"></span><span class="l r"></span></div>
    <p class="ending-msg">${m.msg}</p>
    <div class="dua-final">
      <span>DU'A ✦</span>
      <p>${m.dua}</p>
    </div>
    <p style="margin-top:24px;font-size:12px;font-style:italic;color:var(--ink3);letter-spacing:1px">— with all sincerity, <strong style="color:var(--g3)">affectionree</strong></p>
  </div>`;
}

/* ════════════════════════════════
   EVENTS
════════════════════════════════ */
function bindEvents(s){}

function pickChoice(el,i){
  if(choiceMade)return;
  choiceMade=true;
  document.querySelectorAll('.choice').forEach(c=>{
    c.style.opacity=c===el?'1':'0.45';
    c.style.pointerEvents='none';
  });
  el.style.borderColor='var(--gold)';
  el.style.background='rgba(201,168,76,0.05)';
  const resp=document.getElementById('resp'+i);
  if(resp)resp.style.display='block';
  const cont=document.getElementById('cont');
  if(cont){cont.classList.add('ready');cont.style.marginTop='18px';}
}

function respond(r){
  window._resp=r;
  advance();
}

function advance(){
  current++;
  if(current>=STAGES.length)return;
  choiceMade=false;
  card.classList.add('out');
  setTimeout(()=>render(current),400);
}

function updateProgress(idx){
  if(idx===0){prog.style.display='none';return;}
  prog.style.display='flex';
  const labels=['I','II','III','IV','V','VI','VII'];
  const dots=document.querySelectorAll('.prog-dot');
  const qi=idx-1;
  dots.forEach((d,j)=>{
    d.className='prog-dot';
    if(j<qi)d.classList.add('done');
    else if(j===qi)d.classList.add('active');
  });
  const lbl=document.getElementById('prog-label');
  if(lbl&&idx>0&&idx<8)lbl.textContent=labels[qi]+' / VII';
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
render(0);
</script>
</body>
